# Laurel: Bloomfield Homes coding agent. Repos opt in with one caller workflow. The model is the gateway
# `auto` alias (triage uses `nvidia-super`). Plan: vault Local-Cowork/Plans/2026-11-04-laurel-github-claude-code-action.md
# A person's "/laurel review" comment on a PR runs a read-only review instead of the coding agent.
name: Laurel

on:
  workflow_call:
    secrets:
      LAUREL_APP_PRIVATE_KEY:
        required: true
      LAUREL_GATEWAY_KEY:
        required: true

# Callers must grant actions: read too; a reusable workflow cannot exceed its caller.
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  laurel:
    # Label trigger, or a person's comment starting with /laurel on an issue, any PR conversation, or any PR review.
    # A person's "Request changes" review on a PR Laurel opened also starts a run, with no /laurel needed.
    # startsWith, not contains, so paths like docs/laurel.md do not start a run.
    # Review triggers skip fork PRs. The action itself also refuses actors without write access and all bots,
    # so Copilot's comments are acted on only when a person asks.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'laurel') ||
      (github.event_name == 'issue_comment' && github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body, '/laurel')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.sender.type == 'User' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.comment.body, '/laurel')) ||
      (github.event_name == 'pull_request_review' && github.event.sender.type == 'User' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.event.review.body, '/laurel') ||
          (github.event.review.state == 'changes_requested' && github.event.pull_request.user.login == 'bloomfield-laurel[bot]')))
    runs-on:
      group: laurel
      labels: [self-hosted, laurel]
    timeout-minutes: 90
    concurrency:
      group: laurel-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      # "true" only for a PR conversation comment asking for review.
      LAUREL_REVIEW: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/laurel review') }}
      # "true" for new work from an issue. Only new work is sized; fixes on an open PR are not.
      LAUREL_ISSUE: ${{ github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request) }}
      # "true" for a Request changes review on Laurel's PR without /laurel, which the action needs as a prompt.
      LAUREL_AUTOFIX: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && !startsWith(github.event.review.body, '/laurel') }}
      # "true" for issue work in a repo named in the org variable LAUREL_STAGED_REPOS (comma-separated). Plan, build,
      # review and fix then run as separate fresh agents, and the issue's comments carry state between them.
      LAUREL_STAGED: ${{ (github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)) && contains(format(',{0},', vars.LAUREL_STAGED_REPOS), format(',{0},', github.event.repository.name)) }}
      # Rules every coding agent gets, in both the single-session and the staged path.
      LAUREL_RULES: >-
        You are Laurel, the Bloomfield Homes coding agent. You cannot run tests, Ruby, Node or any build tool here;
        CI runs the tests on the PR. If a command is denied, do not retry it or a variant of it. Work only with this
        repository's files. If a criterion needs a browser, screenshots, a running app, installed packages or another
        repository, do not search for them: skip that criterion and list it under Assumptions for the reviewer. Do not
        touch CI workflows, lockfiles, secrets or deploy files. Do not add dependencies. When you write tests, each
        assertion must fail if the behaviour it names breaks: never assert only that an object exists or is not nil,
        loop over data instead of repeating near-identical examples, name each example for what it asserts, and do not
        add comments explaining the test framework. Follow the repository's CLAUDE.md or AGENTS.md conventions. Commit
        to the current branch with a subject of 50 characters or fewer. Never run git push; the workflow pushes your
        branch and opens the pull request.
      # Bolt's slowest turns run past Claude Code's 10-minute request default, which aborts and retries them.
      API_TIMEOUT_MS: '1200000'
      # Caps each turn's output, reasoning included: one runaway Bolt turn of 9,800 tokens took 8 minutes.
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '4096'
      # Every model name is the gateway's auto alias, which overflows to a PII-screened cloud tier when the local GPU is full.
      ANTHROPIC_BASE_URL: ${{ vars.LAUREL_GATEWAY_URL }}
      ANTHROPIC_MODEL: auto
      ANTHROPIC_DEFAULT_OPUS_MODEL: auto
      ANTHROPIC_DEFAULT_SONNET_MODEL: auto
      ANTHROPIC_DEFAULT_HAIKU_MODEL: auto
      ANTHROPIC_SMALL_FAST_MODEL: auto
      CLAUDE_CODE_SUBAGENT_MODEL: auto
      # Egress off: telemetry, error reports, updates, feedback, feature flags, web fetch, connectors.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
      DISABLE_ERROR_REPORTING: '1'
      DISABLE_AUTOUPDATER: '1'
      DISABLE_FEEDBACK_COMMAND: '1'
      DO_NOT_TRACK: '1'
      CLAUDE_CODE_DISABLE_WEB_FETCH: '1'
      CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: '1'
      CLAUDE_CODE_DISABLE_ARTIFACT: '1'
      ENABLE_CLAUDEAI_MCP_SERVERS: 'false'
      # The local model is not Anthropic: no beta headers, no prompt-cache marks.
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
      DISABLE_PROMPT_CACHING: '1'
    steps:
      - name: Note start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Mint Laurel installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LAUREL_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAUREL_APP_PRIVATE_KEY }}

      - name: Authorize actor
        id: auth
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const { data: user } = await github.rest.users.getByUsername({ username: context.actor });
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (user.type !== 'User' || !['admin', 'write'].includes(perm.permission)) {
              core.setOutput('ok', 'false');
              core.notice(`${context.actor} is ${user.type} with ${perm.permission} access; Laurel needs a person with write access.`);
              return;
            }
            if (context.payload.issue && context.payload.issue.pull_request) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: context.payload.issue.number,
              });
              if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.setOutput('ok', 'false');
                core.notice('Laurel only supports pull requests from this repository.');
                return;
              }
            }
            core.setOutput('ok', 'true');

      - name: Link the Admin Console
        if: steps.auth.outputs.ok == 'true' && vars.LAUREL_CONSOLE_URL != ''
        env:
          CONSOLE_URL: ${{ vars.LAUREL_CONSOLE_URL }}/gh/${{ github.event.repository.name }}/runs/${{ github.run_id }}?issue=${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "::notice title=Watch Laurel live::$CONSOLE_URL"
          echo "[Watch Laurel live in the Admin Console]($CONSOLE_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Require acceptance criteria
        id: gate
        if: steps.auth.outputs.ok == 'true' && env.LAUREL_ISSUE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const issue = context.payload.issue;
            const lines = (issue.body || '').split(/\r?\n/);
            const start = lines.findIndex((l) => /^\s*(#{1,6}\s*|\*\*)?acceptance criteria\b/i.test(l));
            let count = 0;
            if (start >= 0) {
              for (const l of lines.slice(start + 1)) {
                if (/^\s*#{1,6}\s/.test(l)) break;
                const bullet = l.match(/^\s*[-*]\s+(.+)$/);
                if (bullet && bullet[1].replace(/^\[[ xX]\](?:\s+|$)/, '').trim()) count += 1;
              }
            }
            if (count >= 2) {
              core.setOutput('ok', 'true');
              return;
            }
            core.setOutput('ok', 'false');
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: 'Laurel needs at least 2 acceptance criteria bullets before it starts. ' +
                `I found ${count}. Add an "Acceptance criteria" section to the issue with one verifiable ` +
                'outcome per bullet, then add the `laurel` label again.',
            });
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'laurel' });
            } catch (e) {
              core.info(`label not removed: ${e.message}`);
            }

      - name: Acknowledge the request
        id: ack
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONSOLE_URL: ${{ vars.LAUREL_CONSOLE_URL }}/gh/${{ github.event.repository.name }}/runs/${{ github.run_id }}?issue=${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // Sizing can take 20 minutes; this comment shows the issue was picked up.
            // A failed post must not fail the run.
            try {
              const number = (context.payload.issue || context.payload.pull_request).number;
              const url = process.env.CONSOLE_URL;
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const link = url && !url.startsWith('/gh/') ? `[Watch it live](${url})` : `[Follow the run](${runUrl})`;
              const { data: comment } = await github.rest.issues.createComment({
                ...context.repo, issue_number: number,
                body: `Laurel picked this up and is sizing the work before starting. ${link}`,
              });
              core.setOutput('comment_id', String(comment.id));
            } catch (e) {
              core.warning(`Could not acknowledge the request: ${e.message}`);
            }

      - name: Check out repository
        id: checkout
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          # A review diffs against the base branch, which needs full history.
          fetch-depth: ${{ env.LAUREL_REVIEW == 'true' && '0' || '1' }}

      - name: Fetch Laurel's scripts
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Public, so the default token reads it; Laurel's token is scoped to the calling repo.
          repository: Bloomfield-Homes/.github
          ref: main
          path: .laurel-scripts
          sparse-checkout: laurel
          persist-credentials: false

      - name: Move the scripts out of the workspace
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true'
        run: |
          # Outside the workspace, so no agent reads or commits them.
          mv .laurel-scripts/laurel "$RUNNER_TEMP/laurel-lib" && rm -rf .laurel-scripts
          echo "LAUREL_LIB=$RUNNER_TEMP/laurel-lib" >> "$GITHUB_ENV"

      - name: List the repo files
        id: files
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true'
        run: |
          # Handing triage the file list saves the turns it would spend exploring.
          { echo 'list<<LAUREL_FILES'; git ls-files | head -n 500; echo 'LAUREL_FILES'; } >> "$GITHUB_OUTPUT"

      - name: Size the work
        id: triage
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATEWAY_URL: ${{ vars.LAUREL_GATEWAY_URL }}
          GATEWAY_KEY: ${{ secrets.LAUREL_GATEWAY_KEY }}
          FILES: ${{ steps.files.outputs.list }}
        with:
          script: |
            // One chat completion, not an agent run: the agent prompt alone made triage time out.
            const { chatJSONResult } = require(`${process.env.LAUREL_LIB}/gateway.js`);
            const issue = context.payload.issue;
            const title = issue.title;
            const body = issue.body || '';
            const schema = {
              type: 'object',
              // split is optional: when it was required, a model with nothing to split padded whitespace to the cap.
              required: ['files', 'changed_lines'],
              properties: {
                files: { type: 'array', maxItems: 12, items: { type: 'string' } },
                changed_lines: { type: 'integer' },
                split: {
                  type: 'array',
                  maxItems: 5,
                  items: {
                    type: 'object',
                    required: ['title', 'acceptance_criteria'],
                    properties: {
                      title: { type: 'string' },
                      acceptance_criteria: { type: 'array', maxItems: 4, items: { type: 'string' } },
                    },
                  },
                },
              },
            };
            const prompt = [
              `Issue #${issue.number}: ${title}`,
              '',
              body,
              '',
              'Files in this repository (first 500):',
              process.env.FILES,
              '',
              'Estimate the smallest change that meets the acceptance criteria. Report the files you would change ' +
                'and the total changed lines. Only if that exceeds 10 files or 300 lines, propose a split into ' +
                'smaller issues, each with a title and its own acceptance criteria. A rough estimate is enough. ' +
                'Keep the reply short: list at most 12 files, and propose at most 5 issues with at most 4 criteria each.',
            ].join('\n');
            const { reply: estimate, cause } = await chatJSONResult({
              url: process.env.GATEWAY_URL,
              key: process.env.GATEWAY_KEY,
              // The cloud tier directly: one short call should not queue behind the shared GPU. The gateway screens it for PII.
              model: 'nvidia-super',
              system: 'You size GitHub issues for a coding agent. Reply with JSON only, matching the schema.',
              prompt,
              schema,
              // The reply is a short object, so a runaway reply stops fast.
              maxTokens: 2000,
              log: core,
            });
            if (!estimate) {
              core.setOutput('failure', cause || '');
              core.setFailed(`Triage did not return an estimate (${cause})`);
              return;
            }
            core.setOutput('structured_output', JSON.stringify(estimate));
            core.info(
              `Triage: ${(estimate.files || []).length} files, ${estimate.changed_lines} changed lines, ` +
                `${(estimate.split || []).length} split issues`,
            );

      - name: Enforce the size limit
        id: scope
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIAGE: ${{ steps.triage.outputs.structured_output }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
          TRIAGE_FAILURE: ${{ steps.triage.outputs.failure }}
          ACK_ID: ${{ steps.ack.outputs.comment_id }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const MAX_FILES = 10;
            const MAX_LINES = 300;
            // Reuses the acknowledgement comment when there is one.
            const post = async (body) => {
              if (process.env.ACK_ID) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: Number(process.env.ACK_ID), body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: context.payload.issue.number, body,
                });
              }
            };
            const { sizingFailureMessage } = require(`${process.env.LAUREL_LIB}/sizing.js`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // No usable estimate is Laurel's failure, not the issue's: say why and stop.
            const unsized = async (cause) => {
              await post(sizingFailureMessage(cause, runUrl));
              core.setOutput('oversize', 'true');
            };
            if (process.env.TRIAGE_OUTCOME !== 'success') {
              await unsized(process.env.TRIAGE_FAILURE);
              return;
            }
            let est;
            try {
              est = JSON.parse(process.env.TRIAGE);
            } catch (e) {
              await unsized('not_json');
              return;
            }
            const files = Array.isArray(est && est.files) ? est.files : [];
            const lines = Number(est && est.changed_lines) || 0;
            const split = Array.isArray(est && est.split) ? est.split : [];

            // A proposed split means the model judged it oversize, even when it reports zero files or lines.
            if (split.length === 0) {
              if (files.length === 0 || lines <= 0) {
                await unsized('empty');
                return;
              }
              if (files.length <= MAX_FILES && lines <= MAX_LINES) return;
            }
            const plan = split.map((s, i) => {
              const criteria = (s.acceptance_criteria || []).map((c) => `   - [ ] ${c}`).join('\n');
              return `${i + 1}. ${s.title}\n${criteria}`;
            }).join('\n');
            const size = files.length > 0 && lines > 0
              ? `Laurel estimates this at ${files.length} files, about ${lines} changed lines. `
              : 'Laurel judged this too broad for one PR. ';
            const fileList = files.length > 0 ? `Files:\n${files.map((f) => `- \`${f}\``).join('\n')}\n\n` : '';
            const splitText = plan ? `Proposed split:\n${plan}\n\n` : '';
            await post(
              size + `The limit is ${MAX_FILES} files and ${MAX_LINES} lines, so I did not start.\n\n` +
                fileList + splitText +
                'Open these as separate issues and label each one laurel.',
            );
            core.setOutput('oversize', 'true');

      - name: Mark the issue in progress
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_ISSUE == 'true' && steps.scope.outputs.oversize != 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_NUMBER: '1'
          STATUS_FIELD: Status
          STATUS_VALUE: In progress
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // Adds the issue to the org's Dev project; the project's own workflows move it on from here.
            const found = await github.graphql(
              `query($org: String!, $number: Int!, $field: String!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    field(name: $field) { ... on ProjectV2SingleSelectField { id options { id name } } }
                  }
                }
              }`,
              { org: context.repo.owner, number: Number(process.env.PROJECT_NUMBER), field: process.env.STATUS_FIELD },
            );
            const project = found.organization.projectV2;
            const option = project.field && project.field.options.find((o) => o.name === process.env.STATUS_VALUE);
            if (!option) {
              core.warning(`Project ${process.env.PROJECT_NUMBER} has no "${process.env.STATUS_VALUE}" status.`);
              return;
            }
            const added = await github.graphql(
              `mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
              }`,
              { project: project.id, content: context.payload.issue.node_id },
            );
            await github.graphql(
              `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field, value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }`,
              { project: project.id, item: added.addProjectV2ItemById.item.id, field: project.field.id, option: option.id },
            );
            core.info(`Issue #${context.payload.issue.number} is in progress on project ${process.env.PROJECT_NUMBER}.`);

      - name: Run Laurel
        id: laurel
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_REVIEW != 'true' && env.LAUREL_STAGED != 'true' && steps.scope.outputs.oversize != 'true'
        timeout-minutes: 50
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app.outputs.token }}
          anthropic_api_key: ${{ secrets.LAUREL_GATEWAY_KEY }}
          trigger_phrase: '/laurel'
          label_trigger: laurel
          branch_prefix: laurel/
          bot_name: bloomfield-laurel[bot]
          bot_id: '352642980'
          settings: '{"permissions":{"deny":["WebFetch","WebSearch"]}}'
          # A review without /laurel only triggers the action through a prompt; track_progress keeps it in tag mode.
          track_progress: ${{ env.LAUREL_AUTOFIX }}
          prompt: >-
            ${{ env.LAUREL_AUTOFIX == 'true' && 'A reviewer requested changes on this pull request. Fix every unresolved
            review comment from that review, including inline comments, and commit to this branch.' || '' }}
          # The transcript lands in the run log, which anyone who can read the repo can see.
          show_full_output: ${{ github.event.repository.private }}
          claude_args: >-
            --model auto
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*)"
            --append-system-prompt "${{ env.LAUREL_RULES }} Make the smallest change that meets the acceptance criteria. Keep the diff under 300 changed lines and 10 files. Start editing as soon as you know which files to change. When asked on a pull request, fix the unresolved review comments the request points to, including comments from Copilot and other bots, and commit to that pull request's branch. WORKFLOW RULES, which override any earlier instruction to push, to create a pull request or to give a Create a PR link: your work ends at git commit. Never run git push. Never add a push or pull request item to your checklist, never write a Create a PR link, and never explain how to push or open a pull request. The workflow pushes your branch, opens the pull request and links it in your comment. After you commit, update your comment with these sections and stop. Summary: what changed and why. Files: each file you changed. Assumptions: each assumption, or None. On a pull request, add Review comments: each one with what you changed, or why you declined it."

      # Staged path. Each agent stage is a fresh claude-code-action run in agent mode (a prompt, no tracking comment),
      # so no stage carries an earlier one's conversation. The plan and review live in issue comments tagged with a
      # hash of the issue body; a rerun on an unchanged issue reuses the plan instead of re-researching.
      - name: Start the branch
        id: branch
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          name="laurel/issue-$NUMBER-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Find earlier stages
        id: stages
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILES: ${{ steps.files.outputs.list }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const s = require(`${process.env.LAUREL_LIB}/stages.js`);
            const issue = context.payload.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue.number, per_page: 100,
            });
            const rev = s.issueRev(issue.body);
            const plan = s.findStage(comments, 'plan', rev);
            core.setOutput('rev', rev);
            core.setOutput('has_plan', plan ? 'true' : 'false');
            core.setOutput('plan_prompt', s.planPrompt({ issue, files: process.env.FILES }));
            if (plan) core.notice(`Reusing the plan for issue revision ${rev}.`);

      - name: Plan
        id: stage_plan
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true' && steps.stages.outputs.has_plan != 'true'
        timeout-minutes: 20
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app.outputs.token }}
          anthropic_api_key: ${{ secrets.LAUREL_GATEWAY_KEY }}
          bot_name: bloomfield-laurel[bot]
          bot_id: '352642980'
          settings: '{"permissions":{"deny":["WebFetch","WebSearch"]}}'
          show_full_output: ${{ github.event.repository.private }}
          prompt: ${{ steps.stages.outputs.plan_prompt }}
          claude_args: >-
            --model auto
            --max-turns 15
            --allowedTools "Read,Glob,Grep"
            --append-system-prompt "${{ env.LAUREL_RULES }}"

      - name: Record the plan
        id: plan_record
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: ${{ steps.stage_plan.outputs.execution_file }}
          HAS_PLAN: ${{ steps.stages.outputs.has_plan }}
          REV: ${{ steps.stages.outputs.rev }}
          ACK_ID: ${{ steps.ack.outputs.comment_id }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const s = require(`${process.env.LAUREL_LIB}/stages.js`);
            const issue = context.payload.issue;
            const { REV: rev, ACK_ID: ack } = process.env;
            // The live comment is the acknowledgement; a stop message replaces it rather than adding another.
            const say = async (body) => ack
              ? github.rest.issues.updateComment({ ...context.repo, comment_id: Number(ack), body })
              : github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            let plan;
            if (process.env.HAS_PLAN === 'true') {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: issue.number, per_page: 100,
              });
              plan = s.findStage(comments, 'plan', rev);
              await say('Laurel is building this from its earlier plan, since the issue has not changed.');
            } else {
              const text = s.resultText(process.env.EXECUTION_FILE);
              const blocked = s.blockedReason(text);
              if (blocked || !text.includes('## Files')) {
                await say(`**Laurel could not plan this.** ${blocked || 'The planner returned no plan.'}\n\n` +
                  '**Next:** edit the issue so the change can be planned from this repository, then remove and ' +
                  're-add the `laurel` label.');
                core.setOutput('stop', 'true');
                return;
              }
              const { data: posted } = await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body: s.stageComment('plan', rev, 'Laurel plan', text),
              });
              plan = text;
              await say(`Laurel planned this ([plan](${posted.html_url})) and is building it.`);
            }
            core.setOutput('plan', plan);
            core.setOutput('build_prompt', s.buildPrompt({ issue, plan }));

      - name: Build
        id: stage_build
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true' && steps.plan_record.outputs.stop != 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app.outputs.token }}
          anthropic_api_key: ${{ secrets.LAUREL_GATEWAY_KEY }}
          bot_name: bloomfield-laurel[bot]
          bot_id: '352642980'
          settings: '{"permissions":{"deny":["WebFetch","WebSearch"]}}'
          show_full_output: ${{ github.event.repository.private }}
          prompt: ${{ steps.plan_record.outputs.build_prompt }}
          claude_args: >-
            --model auto
            --max-turns 25
            --allowedTools "Read,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*)"
            --append-system-prompt "${{ env.LAUREL_RULES }}"

      - name: Review the build
        id: stage_check
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true' && steps.plan_record.outputs.stop != 'true'
        timeout-minutes: 10
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: ${{ steps.stage_build.outputs.execution_file }}
          START_SHA: ${{ steps.checkout.outputs.commit }}
          PLAN: ${{ steps.plan_record.outputs.plan }}
          REV: ${{ steps.stages.outputs.rev }}
          ACK_ID: ${{ steps.ack.outputs.comment_id }}
          GATEWAY_URL: ${{ vars.LAUREL_GATEWAY_URL }}
          GATEWAY_KEY: ${{ secrets.LAUREL_GATEWAY_KEY }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const s = require(`${process.env.LAUREL_LIB}/stages.js`);
            const { chatJSON } = require(`${process.env.LAUREL_LIB}/gateway.js`);
            const issue = context.payload.issue;
            const { REV: rev, ACK_ID: ack, PLAN: plan, START_SHA: start } = process.env;
            const say = async (body) => ack
              ? github.rest.issues.updateComment({ ...context.repo, comment_id: Number(ack), body })
              : github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            const stop = async (why) => {
              await say(`**Laurel did not build this.** ${why}\n\n**Next:** the plan is in the comment above. ` +
                'Edit the issue to address this, then remove and re-add the `laurel` label.');
              core.setOutput('stop', 'true');
            };
            const blocked = s.blockedReason(s.resultText(process.env.EXECUTION_FILE));
            if (blocked) return stop(`The builder stopped: ${blocked}`);
            const { stdout: count } = await exec.getExecOutput('git', ['rev-list', '--count', `${start}..HEAD`]);
            if (Number(count.trim()) === 0) return stop('The builder made no commits.');

            const { stdout: diff } = await exec.getExecOutput('git', ['diff', `${start}..HEAD`], { silent: true });
            const review = await chatJSON({
              url: process.env.GATEWAY_URL, key: process.env.GATEWAY_KEY, model: 'nvidia-super',
              system: s.REVIEW_SYSTEM, prompt: s.reviewPrompt({ issue, plan, diff }), schema: s.REVIEW_SCHEMA, log: core,
            });
            if (!review) {
              core.warning('The review did not run; the PR opens without it.');
              core.setOutput('review_md', '_Laurel could not run its review. Review the change in full._');
              return;
            }
            const md = s.formatReview(review);
            const { data: posted } = await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number, body: s.stageComment('review', rev, 'Laurel review', md),
            });
            const fix = s.needsFix(review);
            await say(`Laurel built and reviewed this ([review](${posted.html_url}))` +
              (fix ? ' and is fixing what the review found.' : ' and is opening the PR.'));
            core.setOutput('review_md', md);
            core.setOutput('needs_fix', fix ? 'true' : 'false');
            core.setOutput('fix_prompt', s.fixPrompt({ issue, plan, review: md }));

      - name: Fix
        id: stage_fix
        if: steps.auth.outputs.ok == 'true' && (steps.gate.outputs.ok != 'false') && env.LAUREL_STAGED == 'true' && steps.scope.outputs.oversize != 'true' && steps.stage_check.outputs.needs_fix == 'true'
        timeout-minutes: 10
        # A failed fix still leaves the build's commits to push; the PR opens as a draft.
        continue-on-error: true
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app.outputs.token }}
          anthropic_api_key: ${{ secrets.LAUREL_GATEWAY_KEY }}
          bot_name: bloomfield-laurel[bot]
          bot_id: '352642980'
          settings: '{"permissions":{"deny":["WebFetch","WebSearch"]}}'
          show_full_output: ${{ github.event.repository.private }}
          prompt: ${{ steps.stage_check.outputs.fix_prompt }}
          claude_args: >-
            --model auto
            --max-turns 15
            --allowedTools "Read,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*)"
            --append-system-prompt "${{ env.LAUREL_RULES }}"

      - name: Sum up the stages
        id: staged
        if: always() && env.LAUREL_STAGED == 'true' && steps.stages.outcome == 'success'
        env:
          PLAN: ${{ steps.stage_plan.outcome }}
          RECORD: ${{ steps.plan_record.outcome }}
          BUILD: ${{ steps.stage_build.outcome }}
          CHECK: ${{ steps.stage_check.outcome }}
          STOP: ${{ steps.plan_record.outputs.stop || steps.stage_check.outputs.stop }}
          PLAN_FILE: ${{ steps.stage_plan.outputs.execution_file }}
          BUILD_FILE: ${{ steps.stage_build.outputs.execution_file }}
        run: |
          # One outcome for the tidy step: stopped (a stage said why in the live comment), the first failed stage, or success.
          outcome=success file="$BUILD_FILE" stage=
          if [ "$STOP" = true ]; then outcome=stopped
          elif [ "$PLAN" = failure ] || [ "$PLAN" = cancelled ]; then outcome=$PLAN file="$PLAN_FILE" stage=Plan
          else
            for s in "Record the plan=$RECORD" "Build=$BUILD" "Review the build=$CHECK"; do
              o=${s##*=}
              if [ "$o" = failure ] || [ "$o" = cancelled ]; then outcome=$o stage=${s%=*}; break; fi
            done
          fi
          { echo "outcome=$outcome"; echo "execution_file=$file"; echo "stage=$stage"; } >> "$GITHUB_OUTPUT"

      - name: Run Laurel review
        id: review
        if: steps.auth.outputs.ok == 'true' && env.LAUREL_REVIEW == 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          github_token: ${{ steps.app.outputs.token }}
          anthropic_api_key: ${{ secrets.LAUREL_GATEWAY_KEY }}
          trigger_phrase: '/laurel'
          bot_name: bloomfield-laurel[bot]
          bot_id: '352642980'
          # The action adds git write tools to every mode; deny wins over allow, so review stays read-only.
          settings: '{"permissions":{"deny":["WebFetch","WebSearch","Bash(git add:*)","Bash(git commit:*)","Bash(git rm:*)","Bash(git push:*)","Bash(*git-push.sh*)"]}}'
          claude_args: >-
            --model auto
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment,ToolSearch"
            --append-system-prompt "You are Laurel, the Bloomfield Homes code reviewer. Review this pull request's diff against its base branch. Do not edit files, commit or push. Report only real problems: bugs, security issues, missing error handling, broken tests, tests that cannot fail, and clear violations of the repository's own conventions. Skip style nits and praise. Post each finding as an inline comment on the exact line with what is wrong and a concrete fix. Then end with a short summary comment that lists the findings by severity, or says you found none. Never quote secrets, credentials or personal data from the code."

      - name: Push Laurel's branch
        # A failed run (for example max turns) can still leave commits worth keeping.
        if: always() && steps.auth.outputs.ok == 'true' && (steps.laurel.outcome == 'success' || steps.laurel.outcome == 'failure' || steps.stage_build.outcome == 'success' || steps.stage_build.outcome == 'failure')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LAUREL_BOT: bloomfield-laurel[bot]
          LAUREL_BOT_ID: '352642980'
          START_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          branch="$(git rev-parse --abbrev-ref HEAD)"
          # Never write to the default branch, even if the agent switched to it.
          if [ "$branch" = "$DEFAULT_BRANCH" ] || [ "$branch" = "HEAD" ]; then
            echo "::warning::Laurel is on '$branch'; not pushing."
            exit 0
          fi
          if [ "$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD")" = "0" ]; then
            echo "::notice::Laurel made no commits; nothing to push."
            exit 0
          fi

          # Laurel is the only co-author. The action adds the triggering user and Claude Code adds itself,
          # so rewrite the trailers on commits not yet on the remote, which keeps the push a fast-forward.
          # The base is the commit Laurel started from, never origin/<default>: in this shallow clone the
          # default branch can move during the run, and a range against it would rewrite the base into a root.
          base="$START_SHA"
          if git fetch --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
            base="origin/$branch"
          fi
          if git merge-base --is-ancestor "$base" HEAD; then
            export LAUREL_TRAILER="Co-authored-by: $LAUREL_BOT <$LAUREL_BOT_ID+$LAUREL_BOT@users.noreply.github.com>"
            FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --msg-filter \
              'grep -vi "^co-authored-by:" | git interpret-trailers --trailer "$LAUREL_TRAILER"' \
              -- "$base..HEAD"
          else
            echo "::warning::$base is not an ancestor of HEAD; pushing without rewriting co-author trailers."
          fi

          git push origin "HEAD:refs/heads/$branch"

      - name: Enforce small PRs and open the PR
        id: pr
        if: always() && steps.auth.outputs.ok == 'true' && (steps.laurel.outcome == 'success' || steps.laurel.outcome == 'failure' || steps.stage_build.outcome == 'success' || steps.stage_build.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LAUREL_BRANCH: ${{ steps.branch.outputs.name || steps.laurel.outputs.branch_name }}
          # A staged run opens a draft when the build or the fix pass failed.
          LAUREL_OUTCOME: ${{ steps.laurel.outcome != 'skipped' && steps.laurel.outcome || (steps.stage_build.outcome == 'failure' || steps.stage_fix.outcome == 'failure') && 'failure' || 'success' }}
          REVIEW_MD: ${{ steps.stage_check.outputs.review_md }}
          FIX_RAN: ${{ steps.stage_fix.outcome != 'skipped' && steps.stage_fix.outcome != '' }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const MAX_LINES = 300;
            const MAX_FILES = 10;
            const { owner, repo } = context.repo;
            const number = (context.payload.issue || context.payload.pull_request).number;
            const isPr = Boolean(context.payload.pull_request || (context.payload.issue && context.payload.issue.pull_request));
            // On an existing PR, Laurel commits review fixes to that branch; the gate would measure the
            // whole PR, not Laurel's change, so it only guards new PRs opened from issues.
            if (isPr) {
              core.notice('Review fixes on an existing PR; size gate applies to new PRs only.');
              return;
            }
            const head = process.env.LAUREL_BRANCH;
            const base = context.payload.repository.default_branch;
            if (!head) {
              core.notice('Laurel produced no branch; nothing to check.');
              return;
            }
            let cmp;
            try {
              ({ data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${base}...${head}`, per_page: 100,
              }));
            } catch (e) {
              if (e.status !== 404) throw e;
              // GitHub answers 404 both for a missing branch and for one that shares no history with the base.
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              let pushed = true;
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: head });
              } catch (err) {
                if (err.status !== 404) throw err;
                pushed = false;
              }
              const what = pushed
                ? `Laurel pushed [\`${head}\`](${context.serverUrl}/${owner}/${repo}/tree/${head}), but it shares no ` +
                  `history with \`${base}\`, so no PR can be opened from it. This is a workflow fault, not a problem with the issue.`
                : `Laurel finished, but pushing \`${head}\` failed, so there is nothing to review. ` +
                  `The "Push Laurel's branch" step in the [run log](${runUrl}) has the error.`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `${what}\n\n**To retry:** ${pushed ? `delete \`${head}\`, then ` : ''}remove and re-add the ` +
                  '`laurel` label. If it fails the same way again, report it with a link to the run.',
              });
              core.setFailed(pushed ? 'Laurel branch shares no history with the base' : 'Laurel branch was not pushed');
              return;
            }
            if (cmp.ahead_by === 0) {
              core.notice('No commits on the Laurel branch; nothing to check.');
              return;
            }
            const files = cmp.files || [];
            const lines = files.reduce((n, f) => n + f.additions + f.deletions, 0);
            if (lines > MAX_LINES || files.length > MAX_FILES) {
              const byDir = {};
              for (const f of files) {
                const dir = f.filename.includes('/') ? f.filename.split('/').slice(0, 2).join('/') : '(root)';
                byDir[dir] = (byDir[dir] || 0) + f.additions + f.deletions;
              }
              const split = Object.entries(byDir).sort((a, b) => b[1] - a[1])
                .map(([dir, n]) => `- \`${dir}\`: ${n} lines`).join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Laurel's change is ${lines} changed lines in ${files.length} files. The limit is ` +
                  `${MAX_LINES} lines and ${MAX_FILES} files, so I did not open a PR for review as is. ` +
                  `The work is on branch \`${head}\`. Proposed split, one issue per group:\n${split}`,
              });
              if (!isPr) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'laurel' });
                } catch (e) {
                  core.info(`label not removed: ${e.message}`);
                }
              }
              return;
            }
            if (isPr) return;
            const { data: open } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, state: 'open' });
            if (open.length > 0) {
              core.setOutput('pr_url', open[0].html_url);
              return;
            }
            const issue = context.payload.issue;
            const stopped = process.env.LAUREL_OUTCOME === 'failure';
            const note = stopped
              ? 'Laurel stopped before finishing (the run failed). Review the commits before marking this ready.\n\n'
              : '';
            const review = process.env.REVIEW_MD
              ? `\n\n## Laurel review\n${process.env.REVIEW_MD}` +
                (process.env.FIX_RAN === 'true' ? '\n\nLaurel ran one fix pass after this review.' : '')
              : '';
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, head, base,
              title: `Laurel: ${issue.title}`.slice(0, 120),
              body: `${note}Closes #${issue.number}\n\nWritten by Laurel on the local model. A person must review and merge; Laurel never merges.${review}`,
              ...(stopped ? { draft: true } : {}),
            });
            core.setOutput('pr_url', pr.html_url);
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Laurel opened ${pr.html_url} (${lines} changed lines, ${files.length} files). It needs human review.`,
            });

      - name: Tidy Laurel's comments
        if: always() && steps.auth.outputs.ok == 'true' && (steps.laurel.outcome != 'skipped' || steps.review.outcome != 'skipped' || steps.staged.outcome == 'success')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONSOLE_URL: ${{ vars.LAUREL_CONSOLE_URL }}/gh/${{ github.event.repository.name }}/runs/${{ github.run_id }}?issue=${{ github.event.issue.number || github.event.pull_request.number }}
          OUTCOME: ${{ steps.laurel.outcome != 'skipped' && steps.laurel.outcome || steps.review.outcome != 'skipped' && steps.review.outcome || steps.staged.outputs.outcome }}
          STARTED_AT: ${{ steps.start.outputs.at }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file || steps.laurel.outputs.execution_file || steps.staged.outputs.execution_file }}
          ACK_ID: ${{ steps.ack.outputs.comment_id }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          FAILED_STAGE: ${{ steps.staged.outputs.stage }}
          # The staged path's plan and review for this issue revision stay visible across runs.
          STAGE_REV: ${{ steps.stages.outputs.rev }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // One live Laurel comment per thread. This run's progress comment is rebranded and
            // carries any failure note; comments from earlier runs are minimized, not deleted.
            try {
              const number = (context.payload.issue || context.payload.pull_request).number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: number, per_page: 100,
              });
              const since = new Date(process.env.STARTED_AT);
              const mine = comments.filter(c => c.user && c.user.type === 'Bot'
                && c.user.login.startsWith('bloomfield-laurel'));
              const current = process.env.STAGE_REV ? ` rev=${process.env.STAGE_REV} -->` : null;
              const older = mine.filter(c => new Date(c.created_at) < since && !(current && c.body && c.body.includes(current)));
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              // The acknowledgement can hold this run's URL, so it never counts as the tracking comment.
              const tracking = mine.find(c => c.id !== Number(process.env.ACK_ID)
                && new Date(c.created_at) >= since
                && c.body && c.body.includes(`/actions/runs/${context.runId}`));
              // A small model sometimes answers in plain text instead of updating its comment.
              // Post that answer into the comment, and log which tools were denied (names only).
              let result = null;
              try {
                const lines = JSON.parse(require('fs').readFileSync(process.env.EXECUTION_FILE, 'utf8'));
                result = lines.find(m => m.type === 'result') || null;
              } catch (e) {
                core.info(`no execution file: ${e.message}`);
              }
              const denied = [...new Set(((result && result.permission_denials) || []).map(d => d.tool_name))];
              if (denied.length) core.notice(`Laurel was denied: ${denied.join(', ')}`);
              const placeholder = "I'll analyze this and get back to you.";

              const failed = ['failure', 'cancelled'].includes(process.env.OUTCOME);
              const isPr = Boolean(context.payload.pull_request || (context.payload.issue && context.payload.issue.pull_request));
              const stage = process.env.FAILED_STAGE;
              let why = 'Laurel hit an error before finishing.';
              if (process.env.OUTCOME === 'cancelled') why = 'The run was cancelled or hit its time limit.';
              else if (result && result.subtype === 'error_max_turns') why = 'Laurel used all its turns before finishing.';
              else if (!result) why = 'Laurel stopped without a final answer, usually at its time limit.';
              if (stage) why = `The ${stage} stage did not finish. ${why}`;
              let next;
              if (process.env.LAUREL_REVIEW === 'true') next = 'Comment `/laurel review` to try again.';
              else if (isPr) next = 'Comment `/laurel` with what still needs fixing to try again.';
              else next = 'Any commits it made are on its branch, in a draft PR if one opened. If the issue asks for ' +
                'several changes, split it; otherwise remove and re-add the `laurel` label to retry.';
              const note = `**Laurel did not finish.** ${why}\n\n**Next:** ${next}\n\n[Run log](${runUrl})`;

              if (tracking) {
                const marker = "Laurel runs on Bloomfield Homes' local model.";
                const url = process.env.CONSOLE_URL;
                const link = url && !url.startsWith('/gh/') ? ` [Watch this run](${url})` : '';
                let body = tracking.body
                  // The link URL holds literal parens, so match to the line's last one.
                  .replace(/ • \[Create PR ➔\]\([^\n]*\)/g, '')
                  .replace(/Claude Code/g, 'Laurel')
                  .replace(/\bClaude\b/g, 'Laurel');
                if (body.includes(placeholder) && result && typeof result.result === 'string' && result.result.trim()) {
                  body = body.replace(placeholder, result.result.trim());
                }

                // The action's own prompt tells the model to push and to link a PR it cannot open. The workflow
                // does both, so drop that narration and link the real PR.
                const pushTalk = /\b(unable|cannot|can't|not able|couldn't|could not)\b[^\n]*\bpush|\bcreate (the|a) PR\b|\bPR can be created\b|\bopen (the|a) (PR|pull request)\b/i;
                body = body
                  .replace(/^\s*[-*] \[[ xX]\] [^\n]*\b(create|open)\b[^\n]*\b(PR|pull request)\b[^\n]*\n?/gim, '')
                  .replace(/^\s*[-*] \[ \] [^\n]*\bpush\b[^\n]*\n?/gim, '')
                  .split(/\n{2,}/)
                  .filter((p) => !pushTalk.test(p) && !p.includes(marker))
                  .join('\n\n');
                if (process.env.PR_URL && !body.includes(process.env.PR_URL)) {
                  body += `\n\n**Pull request:** ${process.env.PR_URL}`;
                }

                if (failed && !body.includes(note)) body += `\n\n---\n${note}`;
                if (!body.includes(marker)) body += `\n\n<sub>${marker}${link}</sub>`;
                if (body !== tracking.body) {
                  await github.rest.issues.updateComment({ ...context.repo, comment_id: tracking.id, body });
                }
                // The tracking comment carries the run, so the acknowledgement is redundant.
                if (process.env.ACK_ID) {
                  await github.rest.issues.deleteComment({ ...context.repo, comment_id: Number(process.env.ACK_ID) });
                }
              } else if (failed) {
                if (process.env.ACK_ID) {
                  await github.rest.issues.updateComment({ ...context.repo, comment_id: Number(process.env.ACK_ID), body: note });
                } else {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: number, body: note });
                }
              } else if (process.env.STAGE_REV && process.env.PR_URL && process.env.ACK_ID) {
                // A staged run's progress lives in the acknowledgement; once the PR comment exists it is redundant.
                await github.rest.issues.deleteComment({ ...context.repo, comment_id: Number(process.env.ACK_ID) });
              }

              for (const c of older) {
                await github.graphql(
                  'mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }',
                  { id: c.node_id },
                );
              }
            } catch (e) {
              core.warning(`Could not tidy Laurel's comments: ${e.message}`);
            }
