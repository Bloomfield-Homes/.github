name: PR evidence scripts

on:
  pull_request:
    paths: [pr-evidence/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: node --test pr-evidence/*.test.js
